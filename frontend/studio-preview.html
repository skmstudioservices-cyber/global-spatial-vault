<style>

}
@media(prefers-color-scheme:dark){

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap;transition:background .15s}
button:hover{background:var(--hover)}
button.pri{background:var(--green);border-color:var(--green);color:#042f20;font-weight:600}
button.pri:hover{background:var(--greend);color:#fff}
button.danger{color:var(--red)}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:13px}
:focus-visible{outline:2px solid var(--green);outline-offset:1px}

#app{height:100%;display:flex;position:relative}

/* Mobile drawer backdrop */
.drawer-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:90}
.drawer-backdrop.active{display:block}

aside{
  width:var(--sidebar-w);flex:none;background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;height:100%;z-index:95;transition:transform .2s ease;
}
aside .logo-bar{padding:16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
aside h1{font-size:15px;margin:0;font-weight:700;display:flex;gap:8px;align-items:center}
aside h1 i{width:10px;height:10px;border-radius:50%;background:var(--green);display:inline-block;box-shadow:0 0 8px var(--green)}
aside .close-btn{display:none;background:none;border:none;padding:4px;font-size:18px;color:var(--mute)}

.nav-section{padding:12px 14px 4px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--mute)}
.tlist{flex:1;overflow-y:auto;padding:4px 8px}
.titem{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;border-radius:6px;cursor:pointer;font-size:13px;margin-bottom:2px}
.titem:hover{background:var(--hover)}
.titem.on{background:var(--hover);font-weight:600;box-shadow:inset 3px 0 var(--green);color:var(--green)}
.titem span{color:var(--mute);font-size:11px;background:rgba(100,116,139,0.12);padding:2px 6px;border-radius:10px}
.titem.on span{background:var(--green-soft);color:var(--green);font-weight:600}

.side-foot{padding:10px;display:grid;gap:6px;border-top:1px solid var(--line);background:var(--panel)}

main{flex:1;min-width:0;display:flex;flex-direction:column;height:100%;background:var(--bg)}

.bar{
  display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line);
  background:var(--header-bg);overflow-x:auto;flex-wrap:wrap;
}
.bar h2{margin:0 8px 0 0;font-size:16px;font-weight:700;white-space:nowrap}
.menu-btn{display:none;padding:6px 10px;font-size:16px}
.sp{flex:1}

.wrap{flex:1;overflow:auto;position:relative}
table{border-collapse:collapse;min-width:100%;font-size:13px}
th,td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:0;text-align:left;white-space:nowrap}
th{position:sticky;top:0;background:var(--panel);padding:9px 12px;font-weight:600;cursor:pointer;z-index:2;color:var(--text)}
th small{color:var(--mute);font-weight:400;margin-left:4px}
td input[type=text],td input[type=number],td input[type=date]{border:0;border-radius:0;width:100%;min-width:130px;background:transparent;padding:8px 12px}
td input:focus{background:var(--hover);outline-offset:-2px}
td.c{text-align:center;padding:0 10px}
td.id{color:var(--mute);padding:8px 12px;font-size:11px;font-family:monospace}

.empty{padding:60px 20px;text-align:center;color:var(--mute)}
.empty b{display:block;color:var(--text);font-size:16px;margin-bottom:6px}

.status{padding:8px 16px;border-top:1px solid var(--line);color:var(--mute);font-size:12px;display:flex;justify-content:space-between;background:var(--panel)}

dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel-card);color:var(--text);padding:22px;width:min(520px,94vw);box-shadow:0 10px 30px rgba(0,0,0,0.3)}

dialog h3{margin:0 0 10px;font-size:18px}
dialog label{display:block;margin:12px 0 4px;font-weight:600;font-size:13px}
dialog input,dialog select,dialog textarea{width:100%}
dialog p{color:var(--mute);margin:6px 0;font-size:13px}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#0f172a;color:#f8fafc;padding:10px 18px;border-radius:8px;font-size:13px;font-weight:500;box-shadow:0 4px 14px rgba(0,0,0,0.3);z-index:100;border:1px solid #334155}

.home{padding:20px;max-width:1200px;margin:0 auto;width:100%}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.stat{background:var(--panel-card);border:1px solid var(--line);border-radius:10px;padding:16px;color:var(--mute)}
.stat b{display:block;font-size:26px;color:var(--text);margin-bottom:2px;font-weight:700}
.home h3{margin:28px 0 14px;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:space-between}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--panel-card);border:1px solid var(--line);border-radius:10px;padding:16px;cursor:pointer;transition:border-color .15s, transform .1s}
.card:hover{border-color:var(--green);transform:translateY(-1px)}
.card b{display:block;font-size:15px;color:var(--text)}
.card span{color:var(--mute);font-size:12px}
.meter{height:6px;background:var(--line);border-radius:3px;margin-top:12px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--green);border-radius:3px}

/* Badge tags for quick status in cards */
.tag-badge{display:inline-block;font-size:10px;text-transform:uppercase;font-weight:700;padding:2px 6px;border-radius:4px;background:var(--green-soft);color:var(--green);margin-left:6px}

/* Responsive queries */
@media(max-width:768px){
  aside{position:fixed;top:0;bottom:0;left:0;transform:translateX(-100%);box-shadow:4px 0 20px rgba(0,0,0,0.3)}

  .home{padding:14px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .cards{grid-template-columns:1fr}
}
</style>

function ensureStarter() {
  const seed = getRealSeedData();
  Object.keys(seed).forEach(n => {
    if (!db.tables[n] || !db.tables[n].rows || db.tables[n].rows.length === 0) {
      db.tables[n] = seed[n];
    }
  });
  save();
}

function resetAllTables() {
  if (confirm('This will reload all demo repo, Cloudflare pincode, and crowdsourcing tables with real data. Continue?')) {
    db.tables = getRealSeedData();
    cur = 'businesses';
    save();
    render();
    toast('All tables reloaded with authentic real data!');
  }
}

// Auto-seed if tables are empty
if (!Object.keys(db.tables).length || !db.tables.businesses) {
  ensureStarter();
}

/* ---------- layout & responsive navigation ---------- */
function toggleMobileNav(force) {
  mobileNavOpen = force !== undefined ? force : !mobileNavOpen;
  const aside = $('aside');
  const backdrop = $('.drawer-backdrop');
  if (aside) aside.classList.toggle('mobile-open', mobileNavOpen);
  if (backdrop) backdrop.classList.toggle('active', mobileNavOpen);
}

function render() {
  const list = el('div', { class: 'tlist' });
  list.append(el('div', { class: 'titem' + (view === 'home' ? ' on' : ''), onclick: () => { view = 'home'; toggleMobileNav(false); render(); } }, '📊 Dashboard Overview'));
  
  // Categorized table list
  const groups = [
    { label: 'Directory & Business', names: ['businesses', 'reviews', 'leads', 'places', 'cities', 'niches'] },
    { label: 'Crowdsourcing Data', names: ['crowdsourced_hazards', 'amenity_contributions', 'submissions'] },
    { label: 'Cloudflare Pincode DB', names: ['ref_pincode', 'villages', 'village_amenities', 'states'] }
  ];

  const assigned = new Set();
  groups.forEach(g => {
    const present = g.names.filter(n => db.tables[n]);
    if (present.length) {
      list.append(el('div', { class: 'nav-section' }, g.label));
      present.forEach(n => {
        assigned.add(n);
        list.append(el('div', {
          class: 'titem' + (view === 'table' && n === cur ? ' on' : ''),
          onclick: () => { view = 'table'; cur = n; search = ''; scol = ''; sort = null; toggleMobileNav(false); render(); }
        }, n, el('span', {}, String(db.tables[n].rows.length))));
      });
    }
  });

  // Any other custom tables created by user
  const other = Object.keys(db.tables).filter(n => !assigned.has(n));
  if (other.length) {
    list.append(el('div', { class: 'nav-section' }, 'Custom Tables'));
    other.forEach(n => {
      list.append(el('div', {
        class: 'titem' + (view === 'table' && n === cur ? ' on' : ''),
        onclick: () => { view = 'table'; cur = n; search = ''; scol = ''; sort = null; toggleMobileNav(false); render(); }
      }, n, el('span', {}, String(db.tables[n].rows.length))));
    });
  }

  const backdrop = el('div', { class: 'drawer-backdrop' + (mobileNavOpen ? ' active' : ''), onclick: () => toggleMobileNav(false) });

  const side = el('aside', { class: mobileNavOpen ? 'mobile-open' : '' },

      el('button', { onclick: syncDlg }, '☁️ GitHub Sync')
    )
  );

  app.replaceChildren(backdrop, side, el('main', { id: 'main' }));
  drawMain();
}

function drawMain() {
  const main = $('#main'); main.replaceChildren();
  if (view === 'home' || !cur || !db.tables[cur]) return drawHome(main);
  
  const t = db.tables[cur];
  const sel = el('select', { onchange: e => { scol = e.target.value; drawRows(); } }, el('option', { value: '' }, 'All columns'), t.cols.map(c => el('option', { value: c.name }, c.name)));
  sel.value = scol;
  const box = el('input', { type: 'search', placeholder: 'Search ' + cur + '...', value: search, oninput: e => { search = e.target.value.toLowerCase(); drawRows(); } });
  const file = el('input', { type: 'file', accept: '.csv,text/csv', style: 'display:none', onchange: importCSV });
  
  main.append(
    el('div', { class: 'bar' },
      el('button', { class: 'menu-btn', onclick: () => toggleMobileNav(true) }, '☰'),
      el('h2', {}, cur),
      box, sel, el('span', { class: 'sp' }),
      el('button', { class: 'pri', onclick: addRow }, '+ Add row'),
      el('button', { onclick: addCol }, '+ Column'),
      el('button', { onclick: () => file.click() }, 'Import CSV'), file,
      el('button', { onclick: exportCSV }, 'Export CSV'),
      el('button', { onclick: pasteDlg }, 'Paste'),
      el('button', { onclick: clean }, 'Tidy'),
      ...(cur === 'places' || cur === 'businesses' ? [el('button', { onclick: enrich }, 'Find coords'), el('button', { onclick: pinDlg }, '📍 Pin fixer')] : []),
      ...(cur === 'submissions' ? [el('button', { class: 'pri', onclick: promote }, 'Promote approved')] : []),

    ),
    el('div', { class: 'wrap', id: 'wrap' }),
    el('div', { class: 'status', id: 'status' })
  );
  drawRows();
}

function visibleRows() {
  const t = db.tables[cur];
  if (!t) return [];
  let rows = t.rows.filter(r => !search || (scol ? [r[scol]] : Object.values(r)).some(v => String(v ?? '').toLowerCase().includes(search)));
  if (sort) rows = [...rows].sort((a, b) => { const x = a[sort.c] ?? '', y = b[sort.c] ?? ''; return (x > y ? 1 : x < y ? -1 : 0) * sort.d; });
  return rows;
}

function drawRows() {
  const t = db.tables[cur], wrap = $('#wrap'), rows = visibleRows();
  if (!t) return;
  const head = el('tr', {},
    el('th', { style: 'cursor:default;width:60px' }, 'id'),
    t.cols.map(c => el('th', { onclick: () => { sort = sort && sort.c === c.name ? { c: c.name, d: -sort.d } : { c: c.name, d: 1 }; drawRows(); } },
      c.name, el('small', {}, c.type + (sort && sort.c === c.name ? (sort.d > 0 ? ' ▲' : ' ▼') : ''))
    )),
    el('th', { style: 'cursor:default;width:40px' }, '')
  );
  
  const body = rows.map(r => el('tr', {},
    el('td', { class: 'id' }, String(r.id || '').slice(-5)),
    t.cols.map(c => {
      let inp;
      if (c.type === 'boolean') {
        inp = el('input', { type: 'checkbox', onchange: e => { r[c.name] = e.target.checked; save(); } });
        inp.checked = !!r[c.name];
        return el('td', { class: 'c' }, inp);
      }
      inp = el('input', {
        type: c.type === 'number' ? 'number' : c.type === 'date' ? 'date' : 'text',
        'aria-label': c.name,
        value: r[c.name] ?? '',
        onchange: e => { r[c.name] = c.type === 'number' && e.target.value !== '' ? Number(e.target.value) : e.target.value; save(); }
      });
      return el('td', {}, inp);
    }),
    el('td', { class: 'c' },
      el('button', {
        class: 'danger', title: 'Delete row', style: 'padding:2px 6px;font-size:11px',
        onclick: () => { if (confirm('Delete row?')) { t.rows = t.rows.filter(x => x !== r); save(); render(); } }
      }, '✕')
    )
  ));
  
  wrap.replaceChildren(el('table', {}, el('thead', {}, head), el('tbody', {}, body)));
  if (!rows.length) {
    wrap.append(el('div', { class: 'empty' },
      el('b', {}, t.rows.length ? 'No matching rows found' : 'This table is currently empty'),
      t.rows.length ? 'Clear your search query to see all data.' : 'Click "+ Add row" or "Reset / Reload Real Data" to populate demo records.'
    ));
  }
  $('#status').replaceChildren(
    el('span', {}, rows.length + ' of ' + t.rows.length + ' rows in table `' + cur + '`'),
    el('span', {}, '💾 Local & Studio Synced')
  );
}

/* ---------- Table CRUD ---------- */
function newTableDlg() {
  const name = el('input', { placeholder: 'leads', id: 'tn' });
  const cols = el('textarea', { rows: 5, placeholder: 'name\nemail\ncity\nscore:number\npaid:boolean' });
  openDlg('New table', [
    el('label', {}, 'Table name'), name,
    el('label', {}, 'Columns (one per line)'), cols,
    el('p', {}, 'Add :number, :boolean or :date after a name. Everything else is text. An id column is added for you.')],
    'Create table', () => {
      const n = name.value.trim().replace(/\s+/g, '_');
      if (!n) return toast('Give the table a name.');
      if (db.tables[n]) return toast('That table already exists.');
      const c = parseCols(cols.value); if (!c.length) return toast('Add at least one column.');
      db.tables[n] = { cols: c, rows: [] }; view = 'table'; cur = n; save(); dlg.close(); render();
    });
}
function addRow() {
  const r = { id: uid() };
  db.tables[cur].cols.forEach(c => r[c.name] = c.type === 'boolean' ? false : '');
  db.tables[cur].rows.unshift(r); save(); drawRows(); toast('Row added at the top.');
}
function addCol() {
  const v = prompt('New column name and optional type (e.g. price:number, is_active:boolean):'); if (!v) return;
  const [c] = parseCols(v); const t = db.tables[cur];
  if (!c || t.cols.some(x => x.name === c.name)) return toast('Column name is empty or already exists.');
  t.cols.push(c); t.rows.forEach(r => r[c.name] = c.type === 'boolean' ? false : ''); save(); drawMain();
}
function delTable() {
  if (confirm('Delete table "' + cur + '" and all its rows?')) {
    delete db.tables[cur]; view = 'home'; cur = Object.keys(db.tables)[0] || null; save(); render();
  }
}

/* ---------- CSV ---------- */
function parseCSV(s) {
  const out = []; let r = [], f = '', q = false;
  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    if (q) { if (ch === '"') { if (s[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += ch; }
    else if (ch === '"') q = true;
    else if (ch === ',') { r.push(f); f = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && s[i + 1] === '\n') i++; r.push(f); f = ''; out.push(r); r = []; }
    else f += ch;
  }
  if (f || r.length) { r.push(f); out.push(r); }
  return out.filter(x => x.some(y => y !== ''));
}
function importCSV(e) {
  const file = e.target.files[0]; if (!file) return;
  const rd = new FileReader();
  rd.onload = () => ingest(parseCSV(String(rd.result).replace(/^\uFEFF/, '')));
  rd.readAsText(file); e.target.value = '';
}
function ingest(rows) {
  if (rows.length < 2) return toast('The CSV needs a header row and at least one data row.');
  const t = db.tables[cur], head = rows[0].map(h => h.trim().replace(/\s+/g, '_'));
  head.forEach(h => { if (h && h !== 'id' && !t.cols.some(c => c.name === h)) t.cols.push({ name: h, type: 'text' }); });
  rows.slice(1).forEach(v => {
    const r = { id: uid() };
    t.cols.forEach(c => { const i = head.indexOf(c.name); let x = i >= 0 ? (v[i] ?? '') : ''; if (c.type === 'number' && x !== '') x = Number(x); if (c.type === 'boolean') x = String(x).toLowerCase() === 'true'; r[c.name] = x; });
    t.rows.push(r);
  });
  save(); drawMain(); toast((rows.length - 1) + ' rows imported.');
}
function exportCSV() {
  const t = db.tables[cur], esc = v => { v = String(v ?? ''); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  const csv = [['id', ...t.cols.map(c => c.name)].join(',')].concat(visibleRows().map(r => [r.id, ...t.cols.map(c => r[c.name])].map(esc).join(','))).join('\n');
  const a = el('a', { href: URL.createObjectURL(new Blob([csv], { type: 'text/csv' })), download: cur + '.csv' }); a.click();
}

/* ---------- Spatial & Geocoding Features ---------- */
const GB = '0123456789bcdefghjkmnpqrstuvwxyz', DG = ['FC98', 'J327', 'K456', 'LMPT'];
function geohash(lat, lng, n = 13) { let a = [-90, 90], o = [-180, 180], h = '', bit = 0, ch = 0, ev = true; while (h.length < n) { const r = ev ? o : a, v = ev ? lng : lat, m = (r[0] + r[1]) / 2; if (v >= m) { ch = ch * 2 + 1; r[0] = m; } else { ch = ch * 2; r[1] = m; } ev = !ev; if (++bit === 5) { h += GB[ch]; bit = 0; ch = 0; } } return h; }
function digipin(lat, lng) { if (lat < 2.5 || lat > 38.5 || lng < 63.5 || lng > 99.5) return ''; let a = 2.5, b = 38.5, c = 63.5, d = 99.5, s = ''; for (let i = 1; i <= 10; i++) { const la = (b - a) / 4, lo = (d - c) / 4; const r = Math.min(3, Math.max(0, 3 - Math.floor((lat - a) / la))), co = Math.min(3, Math.max(0, Math.floor((lng - c) / lo))); s += DG[r][co]; if (i === 3 || i === 6) s += '-'; b = a + la * (4 - r); a = a + la * (3 - r); c = c + lo * co; d = c + lo; } return s; }
const hasXY = r => r && r.lat !== '' && r.lat != null && r.lng !== '' && r.lng != null && !isNaN(+r.lat) && !isNaN(+r.lng);
function setGeo(r) { if (hasXY(r)) { r.geohash = geohash(+r.lat, +r.lng); r.digipin = digipin(+r.lat, +r.lng); } }

function enrich() {
  const target = db.tables[cur];
  const R = db.tables.ref_pincode;
  if (!R) return toast('Load ref_pincode table first.');
  const m = {};
  R.rows.forEach(x => { if (x.pincode && hasXY(x)) m[String(x.pincode).trim()] = x; });
  let n = 0;
  target.rows.forEach(r => {
    const k = String(r.pincode || '').trim();
    if (!hasXY(r) && m[k]) { r.lat = m[k].lat; r.lng = m[k].lng; n++; }
    setGeo(r);
  });
  save(); drawMain(); toast(n + ' rows located from postal pincode match. Geohash & DIGIPIN generated.');
}

function pasteDlg() {
  const t = el('textarea', { rows: 9, placeholder: 'Paste rows copied from Excel or Google Sheets (tab-separated with header row)...' });
  openDlg('Paste rows into ' + cur, [t], 'Add rows', () => {
    ingest(t.value.split(/\r?\n/).filter(Boolean).map(l => l.split('\t')));
    dlg.close();
  });
}

function clean() {
  const t = db.tables[cur], seen = new Set(), n0 = t.rows.length;
  t.rows.forEach(r => t.cols.forEach(c => { if (typeof r[c.name] === 'string') r[c.name] = r[c.name].trim().replace(/\s+/g, ' '); }));
  t.rows = t.rows.filter(r => { const k = JSON.stringify(t.cols.map(c => r[c.name])); if (seen.has(k)) return false; seen.add(k); return true; });
  save(); drawMain(); toast('Tidied. ' + (n0 - t.rows.length) + ' duplicate rows removed.');
}

/* ---------- Leaflet Pin Fixer ---------- */
function pinDlg() {
  const target = db.tables[cur];
  const box = el('div', { style: 'height:60vh;border-radius:8px;margin-top:10px' });
  const msg = el('p', { style: 'font-weight:600' });
  dlg.style.width = 'min(900px,94vw)';
  dlg.onclose = () => { dlg.style.width = ''; drawMain(); };
  openDlg('Interactive Pin Fixer', [msg, box], 'Close', () => dlg.close());
  
  new Promise(ok => {
    if (window.L) return ok();
    document.head.append(el('link', { rel: 'stylesheet', href: 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css' }));
    const sc = el('script', { src: 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js' });
    sc.onload = ok;
    sc.onerror = () => { msg.textContent = 'Could not load Leaflet map. Requires internet.'; };
    document.head.append(sc);
  }).then(() => {
    const map = L.map(box).setView([22.5, 79], 5);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(map);
    setTimeout(() => map.invalidateSize(), 200);
    
    const next = () => target.rows.find(r => !hasXY(r));
    const say = () => {
      const t = next();
      msg.textContent = t ? '👉 Click map to drop pin for: ' + (t.name || t.address || 'unnamed') + '. Drag markers to fine-tune.' : '✅ All rows have valid coordinates. Drag any marker to adjust.';
    };
    
    const add = r => {
      const m = L.marker([+r.lat, +r.lng], { draggable: true, title: r.name || r.address }).addTo(map);
      m.bindTooltip(r.name || r.address || 'Location');
      m.on('dragend', () => {
        const q = m.getLatLng();
        r.lat = +q.lat.toFixed(6);
        r.lng = +q.lng.toFixed(6);
        setGeo(r);
        save();
        toast('Updated coordinates for ' + (r.name || 'row'));
      });
    };
    
    target.rows.filter(hasXY).forEach(add);
    say();
    
    map.on('click', e => {
      const r = next();
      if (!r) return;
      r.lat = +e.latlng.lat.toFixed(6);
      r.lng = +e.latlng.lng.toFixed(6);
      setGeo(r);
      save();
      add(r);
      say();
    });
  });
}

/* ---------- Submissions Promotion ---------- */
function promote() {
  const S = db.tables.submissions, B = db.tables.businesses;
  if (!S || !B) return toast('Load submissions and businesses tables first.');
  let n = 0;
  S.rows.forEach(s => {
    if (s.status === 'approved') {
      const b = {
        id: uid(),
        name: s.place_name || '',
        category: s.category || '',
        niche: s.niche || '',
        city: '',
        address: s.address || '',
        pincode: s.pincode || '',
        lat: '',
        lng: '',
        phone: s.phone || '',
        whatsapp: '',
        website: '',
        avg_rating: 5.0,
        review_count: 0,
        plan: 'free',
        status: 'published'
      };
      setGeo(b);
      B.rows.unshift(b);
      s.status = 'promoted';
      n++;
    }
  });
  save(); drawMain(); toast(n + ' approved submissions promoted to live businesses directory!');
}
